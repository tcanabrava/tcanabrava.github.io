# The URL the site will be built for
base_url = "https://tcanabrava.github.io"

title = "Tomaz Canabrava Ramblings"
description = "Somewhat updated list of C++, Qt and KDE bits"
author = "Tomaz Canabrava"

default_language = "en"
theme = "tabi"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# No feed_limit: the feed carries every post, not just the most recent N.
generate_feeds = true
feed_limit = 20

taxonomies = [
    {name = "categories", feed = true},
    {name = "tags", feed = true},
]

[search]
index_format = "elasticlunr_json"

[markdown]
smart_punctuation = true
bottom_footnotes = true

[markdown.highlighting]
theme = "catppuccin-frappe"
style = "class"

[extra]
# Main navigation. `url` is relative to base_url.
menu = [
    { name = "projects", url = "projects", trailing_slash = true },
    { name = "archive", url = "archive", trailing_slash = true },
    { name = "tags", url = "tags", trailing_slash = true },
    { name = "categories", url = "categories", trailing_slash = true },
    { name = "about", url = "about", trailing_slash = true },
]

# Allow visitors to switch between light and dark mode.
theme_switcher = true
default_theme = "dark"

# Show an estimated reading time and word count on posts.
show_reading_time = true

# Buttons to jump to the top/bottom of a post.
quick_navigation_buttons = true

# Copy button on code blocks.
copy_button = true

# Show the feed icon next to the site title.
feed_icon = true

# Put the whole post in the feed instead of a truncated summary.
full_content_in_feed = true

socials = [
    { name = "github", url = "https://github.com/tcanabrava", icon = "github" },
]
